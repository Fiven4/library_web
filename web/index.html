<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Электронный каталог библиотеки.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="library_web">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Библиотека</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="startup" role="status" aria-live="polite">
    <div class="startup-content">
      <strong>Библиотека</strong>
      <span>Загрузка приложения</span>
      <i aria-hidden="true"></i>
    </div>
  </div>
  <style>
    #startup { background: #f9f9ff; color: #171b2c; inset: 0; position: fixed; z-index: 1; }
    .startup-content { align-items: center; display: flex; flex-direction: column; font: 16px system-ui, sans-serif; gap: 12px; justify-content: center; min-height: 100%; }
    .startup-content strong { font-size: 24px; }
    .startup-content i { animation: spin 0.8s linear infinite; border: 3px solid #d9ddff; border-right-color: #3f51b5; border-radius: 50%; height: 24px; width: 24px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    window.addEventListener('flutter-first-frame', () => document.getElementById('startup')?.remove());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
